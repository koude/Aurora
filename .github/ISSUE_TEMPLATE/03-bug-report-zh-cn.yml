name: "[简体中文] 错误报告"
description: "创建错误报告以帮助我们修正应用"
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您在百忙之中填写此错误报告。

        注意: 请务必在上方文本框的 `[BUG]` **之后**填写清晰明了的标题。

        注意：这里不提供像是代理服务器之类的服务，请不要反馈非应用自身引起的问题。

        <!-- template -->
  - type: textarea
    id: description
    attributes:
      label: "描述此错误"
      description: "请清晰简洁的描述你遇到的错误。"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "如何复现该错误"
      description: "复现步骤:"
      value: |
        步骤 1: ...
        步骤 2: ...
        步骤 3: ...
        ...
    validations:
      required: true
  - type: textarea
    id: device-info
    attributes:
      label: "设备信息"
      description: |
        输入您正在使用的设备信息。

        例子:
        - 机型: Pixel 4
        - 系统类型: MIUI/AOSP
        - Android 版本: 10
      value: |
        - 机型:
        - 系统类型:
        - Android 版本:
    validations:
      required: true
  - type: textarea
    id: app-info
    attributes:
      label: "应用信息"
      description: |
        输入您正在使用的应用信息。

        请填写 Aurora 版本与 APK 架构（例如 arm64-v8a）。
      value: |
        - 版本:
        - APK 架构:
    validations:
      required: true
  - type: textarea
    id: configure
    attributes:
      render: yml
      label: "配置文件"
      description: |
        可选。仅分享去除订阅链接、凭据、服务器地址等隐私信息后的最小示例。
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      render: raw
      label: "日志"
      description: |
        可选。分享前请移除令牌、地址等隐私信息。
    validations:
      required: false
  - type: textarea
    id: screenshot
    attributes:
      label: "屏幕截图"
      description: "如果适用，请在此粘贴或上传屏幕截图。"
      placeholder: "可选"
  - type: textarea
    id: additional
    attributes:
      label: "附加信息"
      description: "其他的可能与改错误相关的信息。"
      placeholder: "可选"
