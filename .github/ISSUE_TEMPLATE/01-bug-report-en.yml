name: "[English] Bug Report"
description: "Create a report to help us debug bugs"
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        NOTE: Be sure to put a clear and concise title **AFTER** `[BUG]` in the text box above.

        NOTE: We do not provide any services such as proxies, DO NOT feedback any problems not caused by this application here.

        <!-- template -->
  - type: textarea
    id: description
    attributes:
      label: "Describe the bug"
      description: "A clear and concise description of what the bug is."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "To Reproduce"
      description: "Steps to reproduce the behavior:"
      value: |
        Step 1: ...
        Step 2: ...
        Step 3: ...
        ...
    validations:
      required: true
  - type: textarea
    id: device-info
    attributes:
      label: "Device Info"
      description: |
        Input your device information.

        Example:
        - Device: Pixel 4
        - ROM: AOSP
        - Android Version: 10
      value: |
        - Device:
        - ROM:
        - Android Version:
    validations:
      required: true
  - type: textarea
    id: app-info
    attributes:
      label: "Application Info"
      description: |
        Input application you are using information.

        Please include the Aurora version and APK architecture (for example, arm64-v8a).
      value: |
        - Version:
        - APK architecture:
    validations:
      required: true
  - type: textarea
    id: configure
    attributes:
      render: yml
      label: "Configure File"
      description: |
        Optional. Only share a minimal example after removing subscription URLs, credentials, server addresses and other secrets.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      render: raw
      label: "Logs"
      description: |
        Optional. Remove tokens, addresses and other private data before sharing logs.
    validations:
      required: false
  - type: textarea
    id: screenshot
    attributes:
      label: "Screenshot"
      description: "If applicable, add screenshots to help explain your problem."
      placeholder: "Optional"
  - type: textarea
    id: additional
    attributes:
      label: "Additional"
      description: "Add any other context about the problem here."
