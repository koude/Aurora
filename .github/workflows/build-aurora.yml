name: Build Aurora CMFA Baseline

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Restore fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.AURORA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > release.keystore
          test -s release.keystore

      - name: Configure Aurora build
        env:
          STORE_PASSWORD: ${{ secrets.AURORA_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.AURORA_KEY_PASSWORD }}
        run: |
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_HOME}
          custom.application.id=com.koude.aurora
          remove.suffix=true
          EOF
          cat > signing.properties <<EOF
          keystore.password=${STORE_PASSWORD}
          key.alias=aurora
          key.password=${KEY_PASSWORD}
          EOF

      - name: Build Alpha Release
        run: |
          chmod +x gradlew
          ./gradlew app:assembleAlphaRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -type f -name '*.apk' -exec cp {} out/ \;
          ls -lh out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-CMFA-baseline
          path: out/*.apk
          if-no-files-found: error
