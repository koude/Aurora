name: Build Aurora CMFA Baseline

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch submodule branches and tags
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          git submodule foreach --recursive 'git fetch --prune --tags origin "+refs/heads/*:refs/remotes/origin/*" || true'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Install Android components
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Restore fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.AURORA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > release.keystore
          test -s release.keystore

      - name: Configure Aurora build
        env:
          STORE_PASSWORD: ${{ secrets.AURORA_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.AURORA_KEY_PASSWORD }}
        run: |
          cat > local.properties <<EOF2
          sdk.dir=${ANDROID_HOME}
          custom.application.id=com.koude.aurora
          remove.suffix=true
          EOF2
          cat > signing.properties <<EOF2
          keystore.password=${STORE_PASSWORD}
          key.alias=aurora
          key.password=${KEY_PASSWORD}
          EOF2

      - name: Build Alpha Release
        run: |
          chmod +x gradlew
          ./gradlew app:assembleAlphaRelease --stacktrace

      - name: Collect arm64-v8a APK
        run: |
          mkdir -p out
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME"
          ARM64_APK="$(find app/build/outputs/apk -type f -name '*-arm64-v8a-release.apk' -print -quit)"
          test -n "$ARM64_APK"
          cp "$ARM64_APK" "out/Aurora-${VERSION_NAME}-arm64-v8a.apk"
          echo "AURORA_VERSION=${VERSION_NAME}" >> "$GITHUB_ENV"
          ls -lh out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-${{ env.AURORA_VERSION }}-arm64-v8a
          path: out/*.apk
          if-no-files-found: error

      - name: Publish rolling GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RELEASE_TAG="v${AURORA_VERSION}"
          RELEASE_TITLE="Aurora ${AURORA_VERSION} (arm64-v8a)"
          git tag --force "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG" --force

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "Aurora ${AURORA_VERSION}, automatic arm64-v8a build from commit $GITHUB_SHA." \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "Aurora ${AURORA_VERSION}, automatic arm64-v8a build from commit $GITHUB_SHA." \
              --latest
          fi

          gh release upload "$RELEASE_TAG" out/*.apk --clobber
