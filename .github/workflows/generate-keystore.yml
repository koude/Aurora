name: Generate Aurora Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check required secrets
        env:
          STORE_PASSWORD: ${{ secrets.AURORA_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.AURORA_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" || { echo "Missing secret: AURORA_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing secret: AURORA_KEY_PASSWORD"; exit 1; }

      - name: Generate release keystore
        env:
          STORE_PASSWORD: ${{ secrets.AURORA_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.AURORA_KEY_PASSWORD }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore aurora-release.jks \
            -storetype JKS \
            -alias aurora \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Aurora,O=Koude,C=CN"

      - name: Export certificate fingerprint
        env:
          STORE_PASSWORD: ${{ secrets.AURORA_STORE_PASSWORD }}
        run: |
          keytool -list -v \
            -keystore aurora-release.jks \
            -storepass "$STORE_PASSWORD" \
            -alias aurora \
            | grep -E "SHA1:|SHA256:" > aurora-certificate-fingerprints.txt

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurora-release-keystore
          path: |
            aurora-release.jks
            aurora-certificate-fingerprints.txt
          retention-days: 7
          if-no-files-found: error
