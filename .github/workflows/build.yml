name: Build Aurora APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.AURORA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AURORA_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.AURORA_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing secret: AURORA_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing secret: AURORA_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing secret: AURORA_KEY_PASSWORD"; exit 1; }

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.AURORA_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/aurora-release.jks"
          test -s "$RUNNER_TEMP/aurora-release.jks" || { echo "Restored keystore is empty"; exit 1; }

      - name: Build signed Release APK
        env:
          AURORA_KEYSTORE_PATH: ${{ runner.temp }}/aurora-release.jks
          AURORA_STORE_PASSWORD: ${{ secrets.AURORA_STORE_PASSWORD }}
          AURORA_KEY_PASSWORD: ${{ secrets.AURORA_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify mihomo native libraries in APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          unzip -l "$APK" | tee "$RUNNER_TEMP/apk-contents.txt"
          grep -q 'lib/arm64-v8a/libclash.so' "$RUNNER_TEMP/apk-contents.txt" || { echo "Missing libclash.so in APK"; exit 1; }
          grep -q 'lib/arm64-v8a/libmihomo-jni.so' "$RUNNER_TEMP/apk-contents.txt" || { echo "Missing libmihomo-jni.so in APK"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-v0.3.6
          path: app/build/outputs/apk/release/app-release.apk
